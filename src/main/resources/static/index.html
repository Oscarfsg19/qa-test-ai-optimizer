<!doctype html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1">

  <title>AI QA Test Optimizer</title>

  <style>

    body{
      font-family:Arial,sans-serif;
      margin:0;
      background:#BDF9E7;
      color:#1f2937;
    }

    /* HEADER */

    header{
      background:#1E293B;
      color:white;
      padding:18px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
    }

    .logo{
      height:58px;
      width:auto;
      object-fit:contain;
      display:block;
    }

    .header-text{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-end;
      text-align:right;
      margin-left:auto;
    }

    .header-title{
      font-size:22px;
      font-weight:bold;
      line-height:1.2;
    }

    .header-subtitle{
      font-size:14px;
      margin-top:5px;
      opacity:.85;
    }

    /* CONTENIDO */

    main{
      max-width:1200px;
      margin:24px auto;
      padding:0 18px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .card{
      background:white;
      border-radius:12px;
      padding:18px;
      box-shadow:0 2px 10px #00000010;
    }

    /* CAMPOS */

    textarea{
      width:100%;
      min-height:110px;
      box-sizing:border-box;
      border:1px solid #d1d5db;
      border-radius:8px;
      padding:10px;
      font:inherit;
      color:#545454;
      resize:vertical;
    }

    textarea:focus{
      outline:none;
      border-color:#299E9C;
      box-shadow:0 0 0 2px #299E9C33;
    }

    /* BOTONES */

    button{
      background:#299E9C;
      color:white;
      border:0;
      padding:11px 18px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      margin-right:8px;
    }

    button.secondary{
      background:#2563EB;
    }

    button:hover{
      opacity:.9;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    /* TABLAS */

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
    }

    th,
    td{
      border-bottom:1px solid #e5e7eb;
      padding:9px;
      text-align:left;
      font-size:14px;
    }

    /* MÉTRICAS */

    .metrics{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    .metric{
      background:#eef2ff;
      padding:14px;
      border-radius:9px;
    }

    .metric b{
      font-size:25px;
      display:block;
    }

    /* ETIQUETAS */

    .pill{
      display:inline-block;
      padding:4px 8px;
      border-radius:20px;
      background:#e5e7eb;
      font-size:12px;
    }

    /* HALLAZGOS */

    .finding{
      border-left:4px solid #f59e0b;
      padding:10px;
      margin:8px 0;
      background:#fffbeb;
    }

    .ok{
      border-left-color:#10b981;
      background:#ecfdf5;
    }

    .danger{
      border-left-color:#ef4444;
      background:#fef2f2;
    }

    pre{
      white-space:pre-wrap;
    }

    /* INFORMACIÓN DEL ARCHIVO */

    .file-info{
      margin-top:10px;
      font-size:13px;
      color:#545454;
    }

    /* RESPONSIVE */

    @media(max-width:800px){

      .grid{
        grid-template-columns:1fr;
      }

      .metrics{
        grid-template-columns:1fr 1fr;
      }

      header{
        padding:16px 5%;
      }

      .logo{
        height:48px;
      }

      .header-title{
        font-size:18px;
      }

      .header-subtitle{
        font-size:12px;
      }

    }

  </style>

</head>


<body>


<header>

  <!-- LOGO -->

  <img
          src="alegra.png"
          alt="Alegra"
          class="logo"
  >

  <!-- TEXTO -->

  <div class="header-text">

    <div class="header-title">
      AI QA Test Optimizer
    </div>

    <div class="header-subtitle">
      ACME Corp — QA Challenge
    </div>

  </div>

</header>


<main>


  <!-- REQUISITO + SUITE -->

  <div class="grid">


    <!-- REQUISITO -->

    <section class="card">

      <h2>1. Requisito</h2>

      <label>
        Historia de usuario
      </label>

      <textarea id="story">Ingresa la descripción de la historia de usuario</textarea>

      <br><br>

      <label>
        Criterios de aceptación
      </label>

      <textarea id="criteria">Ingresa todos los criterios de aceptación de la historia de usuario</textarea>

    </section>


    <!-- SUITE ACTUAL -->

    <section class="card">

      <h2>2. Suite actual</h2>

      <textarea
              id="cases"
              placeholder="Carga un archivo JSON con tus casos de prueba..."
      ></textarea>

      <p>
        <small>
          Selecciona un archivo JSON desde tu PC.
        </small>
      </p>


      <!-- INPUT DE ARCHIVO -->

      <input
              type="file"
              id="jsonFile"
              accept=".json,application/json"
              style="display:none"
              onchange="loadJsonFile(event)"
      >


      <!-- BOTÓN CARGAR JSON -->

      <button
              type="button"
              class="secondary"
              onclick="document.getElementById('jsonFile').click()"
      >
        Cargar JSON
      </button>


      <!-- BOTÓN ANALIZAR -->

      <button
              type="button"
              onclick="analyze()"
      >
        Analizar con IA
      </button>


      <!-- INFORMACIÓN DEL ARCHIVO -->

      <div
              id="fileInfo"
              class="file-info"
      ></div>

    </section>

  </div>


  <!-- RESULTADO -->

  <section
          class="card"
          style="margin-top:18px"
  >

    <h2>3. Resultado</h2>

    <div id="result">

      <p>
        Carga un archivo JSON y ejecuta el análisis para ver
        duplicados, riesgos, trazabilidad y escenarios faltantes.
      </p>

    </div>

  </section>


</main>


<script>


  /*
   * ============================================================
   * CARGAR JSON DESDE EL PC
   * ============================================================
   */

  function loadJsonFile(event){

    const file =
            event.target.files[0];

    if(!file){
      return;
    }


    // Validar extensión

    if(!file.name.toLowerCase().endsWith('.json')){

      document.getElementById('result').innerHTML =

              '<div class="finding danger">' +
              '<b>Archivo inválido</b><br>' +
              'Selecciona un archivo con extensión .json.' +
              '</div>';

      document.getElementById('fileInfo').textContent = '';

      event.target.value = '';

      return;
    }


    // Crear lector

    const reader =
            new FileReader();


    /*
     * Cuando termina de leer el archivo
     */

    reader.onload = function(e){

      try{

        /*
         * Convertir texto JSON
         * a objeto JavaScript
         */

        const data =
                JSON.parse(e.target.result);


        /*
         * Aceptar estos dos formatos:
         *
         * [
         *   {...},
         *   {...}
         * ]
         *
         * o
         *
         * {
         *   "testCases": [...]
         * }
         */

        const testCases =
                Array.isArray(data)
                        ? data
                        : data.testCases;


        /*
         * Validar que sea una lista
         */

        if(!Array.isArray(testCases)){

          throw new Error(
                  'El JSON no contiene una lista válida de casos de prueba.'
          );

        }


        /*
         * Mostrar casos en textarea
         */

        document.getElementById('cases').value =

                JSON.stringify(
                        testCases,
                        null,
                        2
                );


        /*
         * Mostrar información
         */

        document.getElementById('fileInfo').innerHTML =

                '<b>Archivo:</b> ' +
                file.name +
                ' · ' +
                '<b>Casos:</b> ' +
                testCases.length;


        /*
         * Mostrar mensaje de éxito
         */

        document.getElementById('result').innerHTML =

                '<div class="finding ok">' +

                '<b>JSON cargado correctamente</b><br>' +

                'Se cargaron ' +

                testCases.length +

                ' casos de prueba desde <b>' +

                file.name +

                '</b>.' +

                '</div>';


      }catch(error){

        console.error(error);

        document.getElementById('result').innerHTML =

                '<div class="finding danger">' +

                '<b>Error leyendo el JSON</b><br>' +

                error.message +

                '</div>';

        document.getElementById('fileInfo').textContent = '';

      }

    };


    /*
     * Error leyendo archivo
     */

    reader.onerror = function(){

      document.getElementById('result').innerHTML =

              '<div class="finding danger">' +

              '<b>Error</b><br>' +

              'No fue posible leer el archivo seleccionado.' +

              '</div>';

    };


    /*
     * Leer archivo como texto
     */

    reader.readAsText(file);

  }



  /*
   * ============================================================
   * ANALIZAR
   * ============================================================
   */

  async function analyze(){

    const btn =
            document.querySelector(
                    'button[onclick="analyze()"]'
            );


    btn.disabled = true;

    btn.textContent = 'Analizando...';


    try{

      /*
       * Obtener JSON del textarea
       */

      const casesText =
              document.getElementById('cases').value.trim();


      /*
       * Validar que haya casos
       */

      if(!casesText){

        throw new Error(
                'Primero debes cargar un archivo JSON con los casos de prueba.'
        );

      }


      /*
       * Convertir JSON
       */

      let testCases =
              JSON.parse(casesText);


      /*
       * Aceptar también:
       *
       * {
       *   "testCases": [...]
       * }
       */

      if(!Array.isArray(testCases)){

        testCases =
                testCases.testCases;

      }


      /*
       * Validar estructura
       */

      if(!Array.isArray(testCases)){

        throw new Error(
                'El JSON de casos de prueba no tiene un formato válido.'
        );

      }


      /*
       * Crear request
       */

      const body = {

        userStory:
        document.getElementById('story').value,

        acceptanceCriteria:
        document.getElementById('criteria').value,

        testCases:
        testCases

      };


      /*
       * Enviar al backend
       */

      const res =
              await fetch(
                      '/api/analyze',
                      {

                        method:'POST',

                        headers:{
                          'Content-Type':'application/json'
                        },

                        body:
                                JSON.stringify(body)

                      }
              );


      /*
       * Validar respuesta

       */

      if(!res.ok){

        throw new Error(
                'El servidor respondió con HTTP ' +
                res.status
        );

      }


      /*
       * Leer respuesta
       */

      const data =
              await res.json();


      /*
       * Mostrar resultado
       */

      render(data);


    }catch(e){

      console.error(e);

      document.getElementById('result').innerHTML =

              '<div class="finding danger">' +

              '<b>Error durante el análisis</b><br>' +

              e.message +

              '</div>';


    }finally{

      btn.disabled = false;

      btn.textContent = 'Analizar con IA';

    }

  }



  /*
   * ============================================================
   * RENDER RESULTADO
   * ============================================================
   */

  function render(d){

    let modeElement =
            document.getElementById('mode');


    if(modeElement){

      modeElement.textContent =
              d.mode;

    }


    let html = `

      <div class="metrics">

        <div class="metric">

          <b>${d.totalCases}</b>

          Casos

        </div>


        <div class="metric">

          <b>${d.duplicateGroups}</b>

          Duplicados

        </div>


        <div class="metric">

          <b>${d.traceableCases}</b>

          Con trazabilidad

        </div>


        <div class="metric">

          <b>${d.highRiskCases}</b>

          Alto riesgo

        </div>

      </div>


      <h3>
        Resumen ejecutivo
      </h3>


      <p>
        ${d.executiveSummary}
      </p>


      <h3>
        Hallazgos
      </h3>

    `;


    /*
     * Hallazgos
     */

    if(!d.findings || !d.findings.length){

      html +=
              '<p>No se detectaron hallazgos.</p>';

    }


    if(d.findings){

      d.findings.forEach(f => {

        html += `

          <div class="finding ${
                f.severity === 'HIGH'
                        ? 'danger'
                        : ''
        }">

            <b>${f.type}</b>
            ·
            ${f.severity}

            <br>

            <b>Casos:</b>
            ${f.cases}

            <br>

            ${f.explanation}

            <br>

            <b>Acción:</b>
            ${f.action}

          </div>

        `;

      });

    }


    /*
     * Escenarios faltantes
     */

    html += `

      <h3>
        Escenarios faltantes
      </h3>

      <ul>

    `;


    if(
            d.missingScenarios &&
            d.missingScenarios.length
    ){

      d.missingScenarios.forEach(x => {

        html +=
                `<li>${x}</li>`;

      });

    }else{

      html +=
              '<li>No se detectaron escenarios adicionales con las reglas actuales.</li>';

    }


    /*
     * Recomendaciones
     */

    html += `

      </ul>

      <h3>
        Recomendaciones
      </h3>

      <ul>

    `;


    if(
            d.recommendations &&
            d.recommendations.length
    ){

      d.recommendations.forEach(x => {

        html +=
                `<li>${x}</li>`;

      });

    }


    html +=
            '</ul>';


    /*
     * Mostrar resultado
     */

    document.getElementById('result').innerHTML =
            html;

  }


</script>


</body>

</html>
