spring.application.name=ai-qa-test-optimizer
server.port=8080

# Demo works without an API key using the explainable local analyzer.
# To enable real AI, set:
# AI_ENABLED=true
# AI_API_KEY=your_key
# AI_MODEL=gpt-5.6-luna
# AI_BASE_URL=https://api.openai.com/v1
ai.enabled=${AI_ENABLED:false}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-5.6-luna}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
